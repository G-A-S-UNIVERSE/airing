[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airing"
version = "0.1.0"
description = "Hybrid CMS-OLT Management System - Open-source reference for multi-vendor OLT orchestration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AiRing Contributors"}
]
requires-python = ">=3.11"
keywords = ["olt", "isp", "netdevops", "ftth", "pon", "telemetry", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic>=2.13",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.25",
    "aiosqlite==0.19.0",
    "paho-mqtt==1.6.1",
    "httpx==0.26.0",
    "python-dotenv==1.0.0",
    "loguru==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "black==24.1.1",
    "ruff==0.1.13",
    "mypy==1.8.0",
]
prod = [
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis==5.0.1",
    "pysnmp==4.4.12",
    "orjson==3.9.12",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
]

[project.urls]
Documentation = "https://github.com/your-username/airing/wiki"
Source = "https://github.com/your-username/airing"
Issues = "https://github.com/your-username/airing/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]
